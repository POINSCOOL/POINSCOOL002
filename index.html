<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Практична робота №14 - Завдання 1</title>
    <style>
        /* 2. Налаштування для тегу body */
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. Налаштування для контейнера .container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50%;
            height: 30%;
            background-color: lightblue;
        }

        /* 4. Налаштування для блоків .box */
        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background-color: coral;
            margin: 10px;
            font-size: 28px;
            color: white;
        }
    </style>
</head>
<body>

    <!-- 1. Контейнер з трьома блоками -->
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

</body>
</html>
